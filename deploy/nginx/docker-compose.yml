services:
  nginx:
    image: nginx:stable-alpine
    container_name: gateway-nginx
    restart: always
    network_mode: host
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./00-map.conf:/etc/nginx/conf.d/00-map.conf:ro
      - ./10-upstreams.conf:/etc/nginx/conf.d/10-upstreams.conf:ro
      - ./admin.conf:/etc/nginx/conf.d/admin.conf:ro
      - ./api.conf:/etc/nginx/conf.d/api.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /root/gateway/nginx/certbot:/var/www/certbot:ro
      - /root/gateway/nginx/logs:/var/log/nginx
      - /root/gateway/nginx/cache:/var/cache/nginx
    tmpfs:
      - /tmp
      - /run
      - /var/run
    mem_limit: 256m
    cpus: 0.20
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "nginx -t >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
