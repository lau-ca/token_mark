# Temporary IP-based master/admin entrypoint.
# Access: http://SERVER_IP/
# Later, after the domain is ready, change this back to a domain + HTTPS server.

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 100m;

    # Master must not be used as the AI relay entrypoint.
    location = /v1 { return 403; }
    location ^~ /v1/ { return 403; }
    location = /v1beta { return 403; }
    location ^~ /v1beta/ { return 403; }
    location = /mj { return 403; }
    location ^~ /mj/ { return 403; }
    # Console playground uses /pg/chat/completions with the user's web session.
    # Keep public /v1 blocked on the admin entrypoint, but allow this authenticated UI route.
    location = /pg { return 404; }
    location ^~ /pg/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
    location = /suno { return 403; }
    location ^~ /suno/ { return 403; }
    location = /kling { return 403; }
    location ^~ /kling/ { return 403; }
    location = /jimeng { return 403; }
    location ^~ /jimeng/ { return 403; }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
