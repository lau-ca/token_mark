services:
  new-api-master:
    image: calciumion/new-api:latest
    container_name: new-api-master
    restart: always
    env_file:
      - ./.env
    command:
      - --log-dir
      - /app/logs
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - /root/gateway/master/data:/data
      - /root/gateway/master/logs:/app/logs
    mem_limit: 3g
    cpus: 1.80
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/status | grep -q '\"success\":true'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
