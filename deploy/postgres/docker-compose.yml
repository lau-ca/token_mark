services:
  postgres:
    image: postgres:16-alpine
    container_name: gateway-postgres
    restart: always
    environment:
      POSTGRES_USER: Aether
      POSTGRES_PASSWORD: Aether_@2026!
      POSTGRES_DB: gateway
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - /root/gateway/postgres/data:/var/lib/postgresql/data
      - /root/gateway/postgres/backups:/backups
    shm_size: 256mb
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_buffers=16MB
      - -c
      - default_statistics_target=100
      - -c
      - random_page_cost=1.1
      - -c
      - log_timezone=Asia/Shanghai
      - -c
      - timezone=Asia/Shanghai
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U Aether -d gateway"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
